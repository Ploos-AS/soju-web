name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'

      - name: Format check
        run: |
          gofmt -d .
          test -z "$(gofmt -l .)"

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Compose
        env:
          SOJU_WEB_ADMIN_PASSWORD: ci-password-123456
          SOJU_WEB_SESSION_SECRET: ci-session-secret-01234567890123456789
        run: docker compose config --quiet

      - name: Build amd64 image
        run: |
          docker build \
            --build-arg VERSION=ci \
            --build-arg REVISION="$GITHUB_SHA" \
            -t soju-web:ci .

      - name: Verify non-root runtime
        run: |
          test "$(docker run --rm --entrypoint id soju-web:ci -u)" = "1000"
          test "$(docker run --rm --entrypoint id soju-web:ci -g)" = "1000"

      - name: Verify health endpoint
        run: |
          cid=$(docker run -d --rm \
            -e SOJU_WEB_ADMIN_PASSWORD=ci-password-123456 \
            -e SOJU_WEB_SESSION_SECRET=ci-session-secret-01234567890123456789 \
            -p 127.0.0.1:18080:8080 soju-web:ci)
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:18080/healthz | grep -qx ok; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18080/healthz | grep -qx ok
          docker rm -f "$cid"
          trap - EXIT

      - name: Build arm64 image
        run: |
          docker buildx build \
            --platform linux/arm64 \
            --build-arg VERSION=ci \
            --build-arg REVISION="$GITHUB_SHA" \
            --load \
            -t soju-web:ci-arm64 .

      - name: Verify arm64 binary starts
        run: |
          cid=$(docker run -d --rm --platform linux/arm64 \
            -e SOJU_WEB_ADMIN_PASSWORD=ci-password-123456 \
            -e SOJU_WEB_SESSION_SECRET=ci-session-secret-01234567890123456789 \
            soju-web:ci-arm64)
          trap 'docker logs "$cid" 2>&1 || true; docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          started=false
          for i in $(seq 1 20); do
            if ! docker ps --filter "id=$cid" --format '{{.ID}}' | grep -q .; then
              break
            fi
            if docker logs "$cid" 2>&1 | grep -q "listening on :8080"; then
              started=true
              break
            fi
            sleep 1
          done
          test "$started" = true
          docker rm -f "$cid"
          trap - EXIT
