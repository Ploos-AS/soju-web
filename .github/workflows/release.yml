name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

env:
  GHCR_IMAGE: ghcr.io/ploos-as/soju-web
  DOCKERHUB_IMAGE: ploos1/soju-web

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Verify release tag and commit binding
        run: sh scripts/verify-release-ref.sh "$GITHUB_REF_NAME" "$GITHUB_SHA"

      - name: Validate Docker Hub publication configuration
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -eu
          test "$DOCKERHUB_USERNAME" = "ploos1"
          test -n "$DOCKERHUB_TOKEN"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: |
            ${{ env.GHCR_IMAGE }}
            ${{ env.DOCKERHUB_IMAGE }}
          flavor: |
            latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}
          provenance: mode=max
          sbom: true

      - name: Qualify published image by exact digest
        env:
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -eu
          ghcr_ref="$(sh scripts/verify-exact-digest-runtime.sh "$GHCR_IMAGE" "$IMAGE_DIGEST")"
          dockerhub_ref="$(sh scripts/verify-exact-digest-runtime.sh "$DOCKERHUB_IMAGE" "$IMAGE_DIGEST")"
          docker pull "$ghcr_ref"
          ghcr_resolved="$(docker image inspect "$ghcr_ref" --format '{{index .RepoDigests 0}}')"
          test "$ghcr_resolved" = "$ghcr_ref"
          docker pull "$dockerhub_ref"
          dockerhub_resolved="$(docker image inspect "$dockerhub_ref" --format '{{range .RepoDigests}}{{println .}}{{end}}' | grep -F "${DOCKERHUB_IMAGE}@${IMAGE_DIGEST}" | head -n 1)"
          test "$dockerhub_resolved" = "$dockerhub_ref"
          revision="$(docker image inspect "$ghcr_ref" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')"
          version="$(docker image inspect "$ghcr_ref" --format '{{index .Config.Labels "org.opencontainers.image.version"}}')"
          test "$revision" = "$GITHUB_SHA"
          test "$version" = "$GITHUB_REF_NAME"
          test "$(docker run --rm --entrypoint id "$ghcr_ref" -u)" = "1000"
          test "$(docker run --rm --entrypoint id "$ghcr_ref" -g)" = "1000"
          cid=$(docker run -d --rm \
            -e SOJU_WEB_ADMIN_PASSWORD=release-qualification-password \
            -e SOJU_WEB_SESSION_SECRET=release-qualification-session-secret-0123456789 \
            -p 127.0.0.1:18080:8080 "$ghcr_ref")
          trap 'docker logs "$cid" 2>&1 || true; docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/healthz | grep -qx ok; then
              healthy=true
              break
            fi
            sleep 1
          done
          test "${healthy:-false}" = true
          docker rm -f "$cid"
          trap - EXIT

      - name: Attest GHCR image
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ${{ env.GHCR_IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@d7543c93d881b35a8faa02e8e3605f69b7a1ce62 # v3.10.0

      - name: Sign exact release digests with GitHub OIDC
        env:
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -eu
          test -n "$IMAGE_DIGEST"
          cosign sign --yes "${GHCR_IMAGE}@${IMAGE_DIGEST}"
          cosign sign --yes "${DOCKERHUB_IMAGE}@${IMAGE_DIGEST}"

      - name: Verify keyless release signatures
        env:
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -eu
          test -n "$IMAGE_DIGEST"
          for image in "$GHCR_IMAGE" "$DOCKERHUB_IMAGE"; do
            cosign verify \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate-identity-regexp '^https://github.com/Ploos-AS/soju-web/.github/workflows/release.yml@refs/tags/v.*$' \
              "${image}@${IMAGE_DIGEST}" > /tmp/cosign-verification.json
            test -s /tmp/cosign-verification.json
          done

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub Release already exists for $GITHUB_REF_NAME"
          else
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --generate-notes \
              --title "soju-web $GITHUB_REF_NAME"
          fi
