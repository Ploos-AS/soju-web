name: Release v0.1.0 bootstrap

on:
  push:
    branches: [main]

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

env:
  IMAGE_NAME: ghcr.io/ploos-as/soju-web
  RELEASE_TAG: v0.1.0
  RELEASE_SHA: f9d5034b567b7dc211220bc77b1c2314712a34bf

jobs:
  publish:
    if: github.event.head_commit.message == 'Bootstrap soju-web v0.1.0 release'
    runs-on: ubuntu-latest
    steps:
      - name: Check out qualified release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=0.1.0
            type=raw,value=0.1
            type=raw,value=0
            type=raw,value=latest

      - name: Build and push qualified image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ env.RELEASE_TAG }}
            REVISION=${{ env.RELEASE_SHA }}
          provenance: mode=max
          sbom: true

      - name: Attest image
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Verify multi-arch image
        run: |
          docker buildx imagetools inspect "${IMAGE_NAME}:0.1.0"

      - name: Create GitHub release and tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_SHA" \
            --generate-notes \
            --title "soju-web $RELEASE_TAG"
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"
